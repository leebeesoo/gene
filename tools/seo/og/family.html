<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;background:#F3F1EC;color:#1C1C1E;font-family:'Pretendard Variable',Pretendard,sans-serif;letter-spacing:-.03em;display:flex;align-items:center;padding:0 90px;gap:60px}
.l{flex:1}
.brand{font-size:30px;font-weight:700;color:#1F5F57}
h1{font-size:66px;line-height:1.2;margin:28px 0 26px;font-weight:800;letter-spacing:-.045em}
p{font-size:30px;color:#6F6B64;margin:0;font-weight:500}
svg{width:400px;height:400px;flex:none}
</style></head><body>
<div class="l">
  <div class="brand">식구궁합</div>
  <h1>우리 식구,<br>누가 누굴 살릴까?</h1>
  <p>생일만 넣으면 가족 궁합판 한 장</p>
</div>
<svg viewBox="0 0 400 400" aria-hidden="true">
  <g stroke="#DDD8CE" stroke-width="4" fill="none">
    <polygon points="200,40 352,150 294,330 106,330 48,150"/>
    <path d="M200 40 294 330 48 150 352 150 106 330Z" stroke="#C9C2B4" stroke-dasharray="8 10"/>
  </g>
  <circle cx="200" cy="40" r="34" fill="#2F7D4F"/>
  <circle cx="352" cy="150" r="34" fill="#C8412E"/>
  <circle cx="294" cy="330" r="34" fill="#C99A2E"/>
  <circle cx="106" cy="330" r="34" fill="#9AA0A6"/>
  <circle cx="48" cy="150" r="34" fill="#2E5E9E"/>
  <g font-family="Pretendard Variable,Pretendard,sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">
    <text x="200" y="40">木</text><text x="352" y="150">火</text><text x="294" y="330">土</text><text x="106" y="330">金</text><text x="48" y="150">水</text>
  </g>
</svg>
</body></html>
