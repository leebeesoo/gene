<style>

li{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:600;white-space:nowrap}
li i{width:12px;height:12px;border-radius:50%;flex:none}
p{margin-top:auto;margin-bottom:58px;font-size:27px;color:#6E7076;font-weight:500}
