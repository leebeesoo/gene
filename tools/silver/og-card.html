<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{width:1200px;height:630px;background:#F7F6F2;color:#141413;font-family:'Pretendard Variable',Pretendard,sans-serif;letter-spacing:-.02em;display:flex;padding:72px 80px;gap:40px}
.l{flex:1;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-size:34px;font-weight:700}
.brand svg{width:44px;height:44px;color:#2C6A8E}
h1{font-size:58px;line-height:1.22;margin:52px 0 22px;font-weight:700;letter-spacing:-.035em}
h1 em{font-style:normal;color:#2C6A8E}
p{font-size:28px;color:#5A5852;margin:0;line-height:1.45}
.src{margin-top:auto;font-size:22px;color:#5A5852}
.r{width:420px;border:1px solid #DCD9D1;border-radius:12px;background:#fff;align-self:center}
.row{display:flex;gap:18px;padding:22px 26px;border-top:1px solid #DCD9D1;align-items:baseline}
.row:first-child{border-top:0}
.row b{font-size:26px;width:92px;flex:none;font-variant-numeric:tabular-nums}
.row span{font-size:24px;line-height:1.35}
.row.on{background:#E6F0F6}
.row.on b{color:#2C6A8E}
</style></head><body>
<div class="l">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/><circle cx="15" cy="15.5" r="1.6" fill="currentColor" stroke="none"/></svg>나이별 혜택·검진 달력</div>
  <h1>올해 받을 수 있는<br>혜택과 검진,<br><em>태어난 해</em>로 한눈에</h1>
  <p>기초연금 · 국가건강검진 · 무료 예방접종<br>틀니·임플란트 건강보험 · 경로우대</p>
  <div class="src">보건복지부 · 국민건강보험공단 · 질병관리청 자료 · 2026년 기준</div>
</div>
<div class="r">
  <div class="row"><b>60세</b><span>치매 선별검사<br>노인 안검진</span></div>
  <div class="row on"><b>65세</b><span>기초연금·경로우대<br>폐렴구균·독감 무료 접종</span></div>
  <div class="row"><b>66세</b><span>인지기능 검사<br>노인신체기능검사</span></div>
  <div class="row"><b>70세</b><span>생활습관평가</span></div>
</div>
</body></html>
