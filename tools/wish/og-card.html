<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
html,body{margin:0;width:1200px;height:630px;background:#F6F6F2;font-family:"Pretendard Variable",Pretendard,sans-serif;color:#1A1B17}
.c{position:absolute;inset:0;padding:80px 88px;display:flex;flex-direction:column;justify-content:space-between}
.k{font-size:28px;font-weight:500;color:#66685E;display:flex;align-items:center;gap:14px}
.k svg{width:44px;height:44px;color:#56661C}
h1{font-size:96px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em}
p{font-size:34px;margin:18px 0 0;color:#1A1B17;font-weight:500}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{font-size:26px;border:2px solid #E2E2DA;background:#fff;border-radius:999px;padding:8px 22px}
.chip.on{background:#56661C;border-color:#56661C;color:#fff}
#map{position:absolute;right:70px;top:60px;width:300px;height:510px}
</style></head><body>
<svg id="map" viewBox="72 -2 252 428"></svg>
<div class="c">
  <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="19" rx="8" ry="2.6"/><ellipse cx="12" cy="12.6" rx="5.6" ry="2.2"/><circle cx="12" cy="6.2" r="2.6"/></svg>혹시나랩</div>
  <div><h1 id="t">소원명당</h1><p>소원 빌러 가는 곳, 전국 지도</p></div>
  <div class="chips"><span class="chip on">합격</span><span class="chip">건강</span><span class="chip">사랑</span><span class="chip">재물</span><span class="chip">자녀</span><span class="chip">새해</span><span class="chip">무사안녕</span></div>
</div>
<script src="../../wish/data/geo.js"></script>
<script>
var q=new URLSearchParams(location.search); if(q.get('name')) document.getElementById('t').textContent=q.get('name');
var G=window.LM_GEO, pts=JSON.parse(q.get('pts')||'[]'), h='';
Object.keys(G.regions).forEach(function(k){h+='<path d="'+G.regions[k].d+'" fill="#E7E8DF" stroke="#F6F6F2" stroke-width="1"/>';});
pts.forEach(function(p){var x=(p[1]-G.proj.lonMin)*G.proj.k*G.proj.s,y=(G.proj.latMax-p[0])*G.proj.s;h+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="#56661C" stroke="#F6F6F2" stroke-width="1.5"/>';});
document.getElementById('map').innerHTML=h;
</script>
</body></html>
