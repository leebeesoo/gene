name: Fish probe (draft test)
# 초안 시험용: 실제 API가 오는지만 확인하고 결과 요약을 로그에 남김(5차: 실제 자료를 초안 브랜치에 커밋, 사이트 배포 없음). 커밋·배포 없음. 확인 뒤 지운다.
on:
  push:
    branches: [claude/fish-draft]
    paths: ['.github/workflows/fish-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch real data
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          set +e
          node tools/fish/fetch-index.mjs; echo "index exit $?"
          node tools/fish/fetch-tide.mjs --days=2; echo "tide exit $?"
          node tools/fish/fetch-boats.mjs; echo "boats exit $?"
          node --input-type=module -e '
            import { boatUrl } from "./tools/fish/lib.mjs";
            for (const t of ["json"]) for (const n of [100, 500]) {
              const u = boatUrl(process.env.DATA_GO_KR_KEY, { page: 1, rows: n }).replace(/type=[a-z]+/, "type="+t);
              const r = await fetch(u); const b = await r.text();
              console.log("== boats raw", t, r.status, b.length); console.log("rows", n, "items", (b.match(/fsboNo/g)||[]).length, b.slice(0, 300));
            }'
      - name: Summary
        run: |
          node -e '
          const fs=require("fs");
          for (const f of ["index","tide","boats"]) {
            try { const d=JSON.parse(fs.readFileSync("fish/data/"+f+".json","utf8"));
              const keys=Object.keys(d); console.log("== "+f, "keys:", keys.join(","), "fixture:", d.meta&&d.meta.fixture);
              for (const k of keys) { const v=d[k]; if (Array.isArray(v)) { console.log("  "+k+": "+v.length+" rows"); console.log("  sample: "+JSON.stringify(v.slice(0,2)).slice(0,1500)); } }
            } catch(e) { console.log("== "+f+" error "+e.message); }
          }'
      - name: Commit real data to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fish/data/index.json fish/data/tide.json fish/data/boats.json
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "data(fish 초안): 실제 바다낚시지수·조석·낚시어선 $(TZ=Asia/Seoul date +%F)"
            git pull --rebase origin claude/fish-draft
            git push origin HEAD:claude/fish-draft
          fi
