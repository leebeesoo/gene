name: Surplus data
# 남는 지도(market) 데이터: 매일 06:17 KST(21:17 UTC) 수집 → market/data/surplus*.json 커밋
# 커밋 후 배포는 pages.yml의 workflow_run 트리거가 맡습니다(GITHUB_TOKEN 푸시는 push 트리거를 깨우지 않음).
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: surplus-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test parsers (fixtures)
        run: node tools/surplus/test.mjs
      - name: Collect
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node tools/surplus/collect.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add market/data/surplus*.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data(market): 남는 지도 $(TZ=Asia/Seoul date +%F) 갱신"
            git push origin HEAD:main
          fi
