name: Surplus data
# 남는 지도(market) 데이터: 매일 06:17 KST(21:17 UTC) 수집 → market/data/surplus*.json 을 실행한 브랜치(예약 실행은 기본 브랜치)에 커밋
# 배포는 Cloudflare Pages(Git 연동)가 main 푸시를 보고 자동으로 합니다(DEPLOY.md). 커밋 메시지에 skip-ci 류 표시(대괄호 skip ci·ci skip 등)를 넣지 마세요 — Cloudflare가 배포를 건너뜁니다.
# 출시 전까지 매일 자동 실행은 꺼 둠. 출시할 때 아래 두 줄 주석을 풀면 매일 06:17 KST에 돕니다.
on:
  # schedule:
  #   - cron: '17 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: surplus-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 실행된 브랜치(예약 실행은 저장소 기본 브랜치)를 그대로 씁니다.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test parsers (fixtures)
        run: node tools/surplus/test.mjs
      - name: Collect
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node tools/surplus/collect.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add market/data/surplus*.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data(market): 남는 지도 $(TZ=Asia/Seoul date +%F) 갱신"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
