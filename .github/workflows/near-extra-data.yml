name: Near extra data
# 허브 「내 동네」 카드의 공공데이터 4종(전통시장·장날, 착한가격업소, 지리적표시, 축제)을 매달 받아 tools/near/data/*.json을 배포 브랜치에 커밋
# 키 필요 없음(공공데이터포털 표준·파일 데이터, 농식품부 공공데이터 누리집, 국립수산물품질관리원 누리집). tools/near/fetch-extra.mjs 참고.
# 배포는 Cloudflare Workers Builds(Git 연동)가 배포 브랜치 푸시를 보고 자동으로 합니다(DEPLOY.md). 커밋 메시지에 skip-ci 류 표시를 넣지 마세요.
# 매달 3일 05:41 KST(2일 20:41 UTC). 예약 실행은 저장소 기본 브랜치(main)에서만 돕니다. 손으로: Actions → Near extra data → Run workflow.
on:
  schedule:
    - cron: '41 20 2 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: near-extra-data
  cancel-in-progress: false
env:
  DEPLOY_BRANCH: claude/epic-ramanujan-ddvniq
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 사이트가 배포되는 브랜치를 받아 거기에 데이터를 커밋합니다. 배포 브랜치를 바꾸면 DEPLOY_BRANCH도 바꾸세요.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 하나가 실패해도 나머지는 저장합니다(실패한 파일은 전 것 그대로, 경고만 남김)
      - name: Fetch
        run: node tools/near/fetch-extra.mjs || echo "::warning::일부 자료를 받지 못했어요(위 경고 참고). 받은 것만 커밋합니다."
      # 새 자료가 지역표(common/regions.json)에 다 맞는지 확인. 못 맞추면 여기서 멈추고 커밋하지 않습니다
      - name: Test (지역 맞추기·장날·해 뜨는 시각)
        run: node tools/near/test.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tools/near/data/*.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data(near): 내 동네 공공데이터 $(TZ=Asia/Seoul date +%F) 갱신"
            git pull --rebase origin "${DEPLOY_BRANCH}"
            git push origin "HEAD:${DEPLOY_BRANCH}"
          fi
