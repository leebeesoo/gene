name: Lottomap data
# 명당로드(lottomap) 데이터: 매주 일요일 09:17 KST(일요일 00:17 UTC)에 토요일 추첨 회차의 당첨번호·1등 판매점을 받아
# lottomap/data/draws.js·stores.js 를 배포 브랜치에 커밋합니다. 손으로 돌릴 때는 Actions 탭에서 Run workflow.
# 동행복권 공개 화면이 쓰는 JSON을 --incremental 로 새 회차(+최근 3회)만 받아요(요청 5~6번, 요청 간격 0.9초 이상).
# 새 회차가 없거나 1등 판매점이 아직 공개 전이면 파일을 건드리지 않아 커밋도 없습니다.
# 배포는 Cloudflare Workers Builds(Git 연동)가 배포 브랜치 푸시를 보고 자동으로 합니다(DEPLOY.md). 커밋 메시지에 skip-ci 류 표시(대괄호 skip ci·ci skip 등)를 넣지 마세요 — Cloudflare가 배포를 건너뜁니다.
# 예약 실행은 저장소 기본 브랜치(main)에 이 파일이 있어야 돕니다.
on:
  schedule:
    - cron: '17 0 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lottomap-data
  cancel-in-progress: false
env:
  DEPLOY_BRANCH: claude/epic-ramanujan-ddvniq
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 사이트가 배포되는 브랜치(Cloudflare Workers Builds 설정)를 받아 거기에 데이터를 커밋합니다.
      # 예약 실행은 main의 이 파일로 돌지만, 데이터는 배포 브랜치로 갑니다. 배포 브랜치를 바꾸면 DEPLOY_BRANCH도 바꾸세요.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update (new rounds only)
        run: node lottomap/tools/update-data.mjs --incremental --delay=1500
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add lottomap/data/draws.js lottomap/data/stores.js
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data(lottomap): 명당로드 $(TZ=Asia/Seoul date +%F) 갱신"
            git pull --rebase origin "${DEPLOY_BRANCH}"
            git push origin "HEAD:${DEPLOY_BRANCH}"
          fi
