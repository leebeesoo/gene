name: Fish data
# 물때명당(/fish/) 자료 수집 — ※ 꺼 둔 상태(초안). 손으로만 돌릴 수 있고(workflow_dispatch), 예약 실행은 주석 처리했어요.
# 켜기 전에 할 일(tools/fish/README.md 「켜는 순서」):
#   1) data.go.kr 활용신청 15142486(바다낚시지수)·15156018(조석예보 고·저조)·15074088(낚시어선업 신고정보) 승인
#   2) 실제 응답으로 README 「확인할 것」 점검, test.mjs 통과
#   3) 사장님이 공개를 정한 뒤 tools/seo/build.mjs 의 SKIP_DIRS 에서 'fish' 를 빼고, 아래 schedule 주석을 푼다
# 일정(켤 때): 매일 05:37 KST(20:37 UTC) 지수·조석 / 매주 월요일 05:47 KST(일요일 20:47 UTC) 낚시어선.
# 데이터는 배포 브랜치(DEPLOY_BRANCH)에 커밋. 커밋 메시지에 skip-ci 류 표시를 넣지 마세요(Cloudflare가 배포를 건너뜀).
# 금지구역·낚시터 파일(fetch-files.mjs)은 자동 커밋하지 않아요 — 손으로 돌리고 PR로만.
on:
  # schedule:
  #   - cron: '37 20 * * *'
  #   - cron: '47 20 * * 0'
  workflow_dispatch:
    inputs:
      boats:
        description: '낚시어선도 받기(주간 작업)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: fish-data
  cancel-in-progress: false
env:
  DEPLOY_BRANCH: claude/epic-ramanujan-ddvniq
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test parsers (fixtures)
        run: node tools/fish/test.mjs
      - name: Index + tide (daily)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          node tools/fish/fetch-index.mjs
          node tools/fish/fetch-tide.mjs --days=3
      - name: Boats (weekly)
        if: ${{ github.event.schedule == '47 20 * * 0' || inputs.boats }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node tools/fish/fetch-boats.mjs
      - name: Build pages
        run: node tools/fish/build.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add fish/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data(fish): 물때명당 $(TZ=Asia/Seoul date +%F) 갱신"
            git pull --rebase origin "${DEPLOY_BRANCH}"
            git push origin "HEAD:${DEPLOY_BRANCH}"
          fi
