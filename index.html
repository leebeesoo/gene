<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>재미랩 — 오늘 해볼 만한 것들</title>
<meta name="description" content="오늘의 로또 번호, 리퍼브 식품 장터 맛남의 광장, 나의 뿌리 찾기까지. 매일 들르고 싶은 작은 웹 서비스 모음.">
<meta property="og:title" content="재미랩 — 오늘 해볼 만한 것들">
<meta property="og:description" content="오늘의 로또 번호 · 리퍼브 식품 장터 · 나의 뿌리 찾기">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23ffcc33'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
:root{--bg:#f6f5f2;--fg:#15151a;--muted:#6b6b74;--card:#fff;--line:#e7e5df}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f12;--fg:#f2f2f4;--muted:#9a9aa6;--card:#18181d;--line:#26262d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:960px;margin:0 auto;padding:56px 16px 40px}
h1{font-size:clamp(30px,6vw,48px);letter-spacing:-.03em;margin:0 0 8px;font-weight:800}
.sub{color:var(--muted);margin:0 0 36px;font-size:17px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
a.card{display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:24px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .2s,box-shadow .2s;min-height:220px}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);box-shadow:0 16px 40px -20px rgba(0,0,0,.35);outline:none}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px}
.card h2{margin:0;font-size:22px;letter-spacing:-.02em}
.card p{margin:0;color:var(--muted);line-height:1.5}
.go{margin-top:auto;font-weight:700}
.ad{margin:40px 0 0;min-height:120px}
.ad small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
footer{max-width:960px;margin:0 auto;padding:24px 16px 48px;color:var(--muted);font-size:13px}
footer a{color:inherit}
</style>
</head>
<body>
<main>
  <h1>오늘 뭐 해볼까?</h1>
  <p class="sub">매일 들러도 새로운 작은 서비스들</p>
  <div class="grid">
    <a class="card" href="lotto/">
      <div class="ico" style="background:#fff3c4">🎱</div>
      <h2>오늘의 행운 로또</h2>
      <p>내 생일과 사는 곳으로 뽑는 오늘의 번호, 살 곳과 살 시간까지.</p>
      <span class="go">번호 뽑기 →</span>
    </a>
    <a class="card" href="market/">
      <div class="ico" style="background:#dff3e2">🥬</div>
      <h2>맛남의 광장</h2>
      <p>버려질 뻔한 못난이 농수산물을 산지 가격 그대로. 식당 대량구매도.</p>
      <span class="go">장터 가기 →</span>
    </a>
    <a class="card" href="roots/">
      <div class="ico" style="background:#e3e6f7">🌳</div>
      <h2>나의 뿌리</h2>
      <p>내 안에 흐르는 조상의 피. 유형, 가계도, 시대별 인생, 궁합까지.</p>
      <span class="go">뿌리 찾기 →</span>
    </a>
  </div>
  <div class="ad"><small>광고</small>
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="0000000000" data-ad-format="auto" data-full-width-responsive="true"></ins>
  </div>
</main>
<footer>© 재미랩 · 모든 입력 정보는 내 기기에만 저장됩니다.</footer>
<script>try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}</script>
</body>
</html>
