<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>홈서비스 운영 콘솔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 좌측 내비 + 상단 바 + 본문(#view) + 우측 드로어. 화면별 CSS는 각 screens/*.js가 <style>로 주입 가능 */
:root{
  --bg:#f4f5f3;--surface:#fff;--surface2:#f9faf9;--ink:#1b2220;--muted:#5d6864;--line:#dfe4e1;
  --accent:#0d6b5e;--accent-soft:#e0efeb;--ok:#2f7d32;--ok-soft:#e5f2e5;--warn:#a85f00;--warn-soft:#fbefdc;
  --bad:#b3261e;--bad-soft:#fbe7e5;--info:#2b5fb3;--info-soft:#e4ecf9;--mute-soft:#eceeed;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111514;--surface:#191f1d;--surface2:#1e2523;--ink:#e5ebe8;--muted:#9aa6a1;--line:#2b3431;--accent:#4fb8a6;--accent-soft:#1c3330;--ok:#6cc070;--ok-soft:#1d2e1e;--warn:#e5a54a;--warn-soft:#33281a;--bad:#ef7a70;--bad-soft:#3a1f1d;--info:#79a6ee;--info-soft:#1c2738;--mute-soft:#262d2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111514;--surface:#191f1d;--surface2:#1e2523;--ink:#e5ebe8;--muted:#9aa6a1;--line:#2b3431;--accent:#4fb8a6;--accent-soft:#1c3330;--ok:#6cc070;--ok-soft:#1d2e1e;--warn:#e5a54a;--warn-soft:#33281a;--bad:#ef7a70;--bad-soft:#3a1f1d;--info:#79a6ee;--info-soft:#1c2738;--mute-soft:#262d2b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans)}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:15px;padding:0 10px 16px}.brand small{display:block;font:11px var(--mono);color:var(--muted);font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;color:var(--ink);text-decoration:none}
.nav a:hover{background:var(--surface2)}.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{margin-left:auto;background:var(--bad);color:#fff;font:600 11px var(--mono);border-radius:999px;padding:0 7px}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.topbar{display:flex;align-items:center;gap:12px;padding-block:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.topbar h1{font-size:19px;margin:0}.topbar .who{margin-left:auto;color:var(--muted);font-size:12.5px}
.demo{font:11px var(--mono);background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 6px}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto;padding:10px}.brand{padding-bottom:8px}.nav{flex-direction:row;overflow-x:auto}.nav a{white-space:nowrap}}
/* 공용 컴포넌트 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid{display:grid;gap:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;font:inherit;padding:8px 12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);font-weight:600;border-color:var(--accent)}.tabs b{font:500 12px var(--mono);margin-left:4px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);background:var(--surface2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}.pill.accent{background:var(--accent-soft);color:var(--accent)}.pill.mute{background:var(--mute-soft);color:var(--muted)}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}.btn.danger{color:var(--bad)}
.btn:focus-visible,.nav a:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 9px}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}
.label{font:11px var(--mono);color:var(--muted);letter-spacing:.04em}
.kpi{font:500 22px var(--mono);font-variant-numeric:tabular-nums}
#scrim{position:fixed;inset:0;background:rgba(10,14,13,.35);z-index:20}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
#drawerClose{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px))}
.drawer-body{overflow:auto;padding:20px;flex:1}
#drawer[hidden],#scrim[hidden],#toast[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">집도우미 운영 콘솔<small>OPS · 2026-11-05 14:00</small></div>
    <nav class="nav">
      <a href="#home" data-k="home">홈</a>
      <a href="#bookings" data-k="bookings">예약 관리<span class="badge" hidden></span></a>
      <a href="#dispatch" data-k="dispatch">배정 보드<span class="badge" hidden></span></a>
      <a href="#partners" data-k="partners">파트너<span class="badge" hidden></span></a>
      <a href="#settlement" data-k="settlement">정산<span class="badge" hidden></span></a>
      <a href="#cs" data-k="cs">리뷰·CS<span class="badge" hidden></span></a>
    </nav>
  </aside>
  <main class="main">
    <div class="topbar"><h1 id="pageTitle">홈</h1><span class="demo">가상 데이터</span><span class="who">운영자 · 이운영</span></div>
    <div id="view"></div>
  </main>
</div>
<div id="scrim" hidden></div>
<aside id="drawer" hidden aria-label="상세"><button class="btn" id="drawerClose" type="button">닫기</button><div class="drawer-body"></div></aside>
<div id="toast" hidden role="status"></div>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="screens/home.js"></script>
<script src="screens/bookings.js"></script>
<script src="screens/dispatch.js"></script>
<script src="screens/partners.js"></script>
<script src="screens/settlement.js"></script>
<script src="screens/cs.js"></script>
</body>
</html>
